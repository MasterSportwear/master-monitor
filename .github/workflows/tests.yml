name: Testes
on: [push, pull_request]
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test

  windows-chrome:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Protocolo nativo e compilacao Windows
        run: node --test tests/native-host.test.js
      - name: Leitura local de dominios
        shell: powershell
        run: ./tests/chrome-reader.ps1
      - name: Sintaxe e fila Windows
        shell: powershell
        run: ./tests/queue.ps1
