name: Publicar painel
on:
  push:
    branches: [main]
    paths: ['web/**','scripts/**','windows/**','chrome/**','.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Gerar painel
        env:
          MM_SUPABASE_URL: ${{ vars.MM_SUPABASE_URL }}
          MM_PUBLISHABLE_KEY: ${{ vars.MM_PUBLISHABLE_KEY }}
        run: node scripts/build.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
